<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat With Any Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 800px;
            margin: 60px auto;
            background: #1e293b;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        h1 {
            margin-top: 0;
            text-align: center;
        }

        p.subtitle {
            text-align: center;
            color: #cbd5e1;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: none;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            margin-top: 22px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            background: #8b5cf6;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #7c3aed;
        }

        .answer-box {
            margin-top: 30px;
            background: #334155;
            padding: 20px;
            border-radius: 12px;
            white-space: pre-wrap;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Chat With Any Website</h1>
        <p class="subtitle">Paste a website URL, ask a question, and get a grounded answer.</p>

        <form method="post" action="/chat">
            <label for="url">Website URL</label>
            <input type="text" id="url" name="url" value="{{ url }}" placeholder="http://example.com" required>

            <label for="question">Your Question</label>
            <input type="text" id="question" name="question" value="{{ question }}" placeholder="What is this website used for?" required>

            <button type="submit">Ask</button>
        </form>

        {% if answer %}
        <div class="answer-box">
            <strong>Answer:</strong><br><br>
            {{ answer }}
        </div>
        {% endif %}
    </div>
</body>
</html>
